# The overlay a host passes as `dsh --profile acp --patch drgnx.overlay.yml`: full-access sandbox mode, the approval
# policy kept at `ask` (the base bundle ties `never` to that mode, and `never` rejects every ask), and the ask plugin.
- id: sandbox-policy
  config:
    mode: danger-full-access

- id: approval
  config:
    policy: ask

- insert:
    - id: drgnx-ask
      name: '@deepseek-ai/dsh-acp-drgnx-ask'
      config:
        kinds: [execute, edit]
